name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install pandas scikit-learn xgboost mlflow fastapi uvicorn kaggle

    - name: Download dataset
      env:
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      run: |
        mkdir -p data
        kaggle competitions download -c home-credit-default-risk -f application_train.csv -p data/
        cd data && unzip application_train.csv.zip && cd ..

    - name: Run training script
      run: python src/train.py